<h1>{{ topic.name }} — Practice Questions</h1>
<p>{{ practiced_ids|length }} of {{ questions|length }} practiced</p>

<ul>
{% for q in questions %}
    <li>
        <form method="post" action="{% url 'toggle_question_practiced' q.id %}" style="display:inline;">
            {% csrf_token %}
            <input type="checkbox" onchange="this.form.submit()" {% if q.id in practiced_ids %}checked{% endif %}>
        </form>
        [{{ q.year }}] {{ q.subtopic }} ({{ q.marks }} marks) — {{ q.question_text }}
    </li>
{% endfor %}
</ul>

<a href="/dashboard/">Back to Dashboard</a>
