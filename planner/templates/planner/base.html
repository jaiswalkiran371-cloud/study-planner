<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Study Planner{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'planner/theme.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📘 StudyPlanner</a>
            {% if user.is_authenticated %}
            <div>
                <span class="text-white me-2 small">Welcome, {{ user.username }}</span>
                <a href="/dashboard/" class="btn btn-outline-light btn-sm">Dashboard</a>
                <a href="/logout/" class="btn btn-outline-light btn-sm">Logout</a>
                <a href="/profile/" class="btn btn-outline-light btn-sm">Profile</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
